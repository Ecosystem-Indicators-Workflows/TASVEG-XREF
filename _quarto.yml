project:
  type: book

book:
  title: "Cross-referencing Tasmanian Terrestrial Ecosystems"
  author: 
    - JR Ferrer-Paris
    - M Tozer
    - Elliot Gould
    - Abhimanyu Raj Singh
    - J Balmer
    - A Kitchener
    - A Latinovic
    - DA Keith

  chapters:
    - index.qmd
    - file: stepwise.qmd
      text: "Crossreferencing steps"
    - part: "Assess alignment"
    - part: "Assemble information"
    - part: "Membership tables"
      chapters:
      - membership-tables.qmd
      - file: "read-input-xref-data.ipynb"
        text: "Input data"
    - part: "Multiple interpreters"
    - part: "Multiple rounds"
      chapters:
      - file: "visualise-agreement.ipynb"
        text: "Viz agreement"
      - file: "visualise-agreement.out.ipynb"
      - file: "viz_explore_ars.ipynb"
      - file: "viz-agreement-EG.qmd"
    - part: "Synthesis" 
      chapters:
      - "EFG-map.qmd" 
    - references.qmd
  margin-header: |
    <center>
    ![](/assets/logo_CES.png){height=66px}
    </center>
  page-footer:
    left: "This site prepared by: [EIW project team](https://github.com/Ecosystem-Indicators-Workflows)"
    center: "![](/assets/unsw_new_logo.png){height=20px} We acknowledge the Bedegal and Gadigal peoples who are the Traditional Owners of the lands where UNSW Sydney is located. We pay our respects to Elders past and present."

bibliography: references.bib

format:
  html:
    theme: minty
    css: styles.css
    highlight-style: solarized
    toc: true
    sidebar-width: 300px # Default is 250px
  pdf:
    documentclass: scrreprt